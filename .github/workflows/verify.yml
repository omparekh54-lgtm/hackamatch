name: Verify HackAMatch
on: [push, pull_request, workflow_dispatch]
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: hackamatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U test -d hackamatch_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test:synthetic-ci-password@localhost:5432/hackamatch_test
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:synthetic-ci-password@localhost:5432/hackamatch_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: hackamatch_smoke_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U test -d hackamatch_smoke_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build full application image
        run: docker build -t hackamatch-smoke .
      - name: Start frontend, API and worker
        run: >-
          docker run -d --name hackamatch-smoke --network host
          -e DATABASE_URL=postgresql://test:synthetic-ci-password@localhost:5432/hackamatch_smoke_test
          -e PUBLIC_URL=http://localhost:10000
          -e PORT=10000
          hackamatch-smoke
      - name: Verify live application routes
        run: python deploy/smoke_test.py
      - name: Show container logs on failure
        if: failure()
        run: docker logs hackamatch-smoke
